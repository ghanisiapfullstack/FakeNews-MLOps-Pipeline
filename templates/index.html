<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector | MLOps Project</title>
    <script src="https://cdn.tailwindcss.com"></script> <!-- Pakai Tailwind -->
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Fake News Detector</h1>
        <p class="text-gray-500 mb-6">Masukkan teks berita di bawah untuk mengecek kebenarannya.</p>
        
        <textarea id="newsInput" rows="6" class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none mb-4" placeholder="Tempel teks berita di sini..."></textarea>
        
        <button onclick="checkNews()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200">
            Cek Berita
        </button>

        <div id="resultBox" class="mt-6 p-4 rounded-xl hidden">
            <p class="text-sm font-semibold uppercase tracking-wider">Hasil Analisis:</p>
            <h2 id="predictionResult" class="text-2xl font-black mt-1"></h2>
        </div>
    </div>

    <script>
        async function checkNews() {
            const text = document.getElementById('newsInput').value;
            const resultBox = document.getElementById('resultBox');
            const predictionResult = document.getElementById('predictionResult');

            if (!text) {
                alert("Tolong masukkan teks beritanya dulu ya!");
                return;
            }

            // Kirim data ke Flask API /predict
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();

            if (data.status === 'success') {
                resultBox.classList.remove('hidden');
                predictionResult.innerText = data.prediction;
                
                // Styling dinamis (Hijau untuk Real, Merah untuk Fake)
                if (data.prediction === "Real News") {
                    resultBox.className = "mt-6 p-4 rounded-xl bg-green-100 text-green-800 border border-green-200";
                } else {
                    resultBox.className = "mt-6 p-4 rounded-xl bg-red-100 text-red-800 border border-red-200";
                }
            }
        }
    </script>
</body>
</html>
